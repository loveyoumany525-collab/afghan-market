<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>افغان مارکت - خرید و فروش ماشین</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma; }
        body { background: #f5f5f5; }
        header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 25px; text-align: center; }
        header h1 { font-size: 2.2em; margin-bottom: 5px; }
        .container { max-width: 1200px; margin: 30px auto; padding: 20px; }
        .section-title { text-align: center; font-size: 1.8em; margin-bottom: 25px; color: #1e3c72; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .product { background: white; border-radius: 12px; box-shadow: 0 3px 15px rgba(0,0,0,0.1); overflow: hidden; transition: 0.3s; }
        .product:hover { transform: translateY(-5px); }
        .product img { width: 100%; height: 220px; object-fit: cover; }
        .product-info { padding: 15px; }
        .product h3 { color: #1e3c72; font-size: 1.3em; margin-bottom: 10px; }
        .details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; font-size: 0.9em; }
        .detail-item { background: #f0f4ff; padding: 8px; border-radius: 6px; }
        .detail-label { color: #666; font-size: 0.85em; }
        .detail-value { font-weight: bold; color: #333; }
        .price { font-size: 1.5em; color: #e74c3c; font-weight: bold; text-align: left; margin-top: 10px; }
        .contact-btn { background: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 1.1em; cursor: pointer; margin-top: 10px; }
        footer { background: #1e3c72; color: white; text-align: center; padding: 20px; margin-top: 50px; }
    </style>
</head>
<body>
    <header>
        <h1>🚗 افغان مارکت</h1>
        <p>بزرگترین نمایشگاه آنلاین ماشین و فرش افغانستان</p>
    </header>
    
    <div class="container">
        <h2 class="section-title">ماشین های ویژه برای فروش</h2>
        <div class="products">
            
            <div class="product">
                <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600" alt="Toyota">
                <div class="product-info">
                    <h3>تویوتا کرولا</h3>
                    <div class="details">
                        <div class="detail-item">
                            <div class="detail-label">سال ساخت</div>
                            <div class="detail-value">2020</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">کیلومتر</div>
                            <div class="detail-value">45,000 km</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">گیربکس</div>
                            <div class="detail-value">اتوماتیک</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">رنگ</div>
                            <div class="detail-value">سفید</div>
                        </div>
                    </div>
                    <p><b>وضعیت:</b> بدون رنگ، سالم، 4 سیلندر، کولر روشن</p>
                    <div class="price">500,000 افغانی</div>
                    <button class="contact-btn">📞 تماس برای خرید</button>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <p>© 2026 افغان مارکت - برای ثبت آگهی با ما تماس بگیرید ❤️</p>
    </footer>
</body>
</html>
