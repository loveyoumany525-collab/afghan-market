<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">افغان مارکت ماشین</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma;background:#f0f2f5}
header{background:#2a5298;color:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:999}
.lang-select{padding:6px;border-radius:5px;border:none}
#filterBtn{background:#fff;color:#2a5298;border:none;padding:8px 15px;border-radius:5px;font-weight:bold;cursor:pointer}
.container{max-width:1200px;margin:15px auto;padding:10px}

/* پاپ آپ */
#filterModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000}
#filterModal.active{display:block}
.modal-content{background:#fff;width:100%;max-width:500px;margin:0 auto;height:100%;overflow-y:auto;padding:15px}
.modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:10px;margin-bottom:15px}
.filter-section{margin-bottom:20px}
.filter-section h4{margin-bottom:10px;color:#2a5298}
.city-tags{display:flex;gap:8px;flex-wrap:wrap}
.city-tag-btn{padding:8px 14px;border:1px solid #ccc;border-radius:20px;background:#fff;cursor:pointer}
.city-tag-btn.active{background:#2a5298;color:#fff}

/* نوار رنج */
.range-box{margin:25px 0}
.range-values{display:flex;justify-content:space-between;font-weight:bold;color:#2a5298;margin-bottom:8px}
.range-slider{position:relative;height:6px;background:#ddd;border-radius:5px}
.range-progress{position:absolute;height:6px;background:#2a5298;border-radius:5px}
.range-inputs input{position:absolute;width:100%;height:6px;top:-6px;background:transparent;pointer-events:none;appearance:none}
.range-inputs input::-webkit-slider-thumb{pointer-events:auto;width:20px;height:20px;border-radius:50%;background:#2a5298;appearance:none;border:3px solid #fff}

.quick-btns{display:flex;gap:8px;margin-top:10px}
.quick-btn{flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;background:#f8f8f8;cursor:pointer;text-align:center;font-size:12px}
.modal-footer{display:flex;gap:10px;margin-top:20px;padding-top:15px;border-top:1px solid #ddd;position:sticky;bottom:0;background:#fff}
.btn-clear{flex:1;padding:12px;border:1px solid #ccc;background:#fff;border-radius:5px;font-weight:bold}
.btn-show{flex:2;padding:12px;background:#2a5298;color:#fff;border:none;border-radius:5px;font-weight:bold}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}
.product{background:#fff;border-radius:10px;padding:12px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.product img{width:100%;height:180px;object-fit:cover;border-radius:8px}
.price{color:#e74c3c;font-weight:bold;font-size:18px;margin:8px 0}
.btn-wa{width:100%;padding:10px;background:#25D366;color:#fff;border:none;border-radius:5px;font-weight:bold}
</style>
</head>
<body>
<header>
<h1 id="headerTitle" style="font-size:18px">🚗 افغان مارکت</h1>
<div>
<select class="lang-select" id="lang">
<option value="fa">فارسی</option>
<option value="en">English</option>
<option value="ps">پښتو</option>
</select>
<button id="filterBtn">🔍 فیلتر</button>
</div>
</header>

<div class="container">
<div class="products" id="list">
<div class="product" data-brand="تویوتا" data-year="2020" data-city="کابل" data-price="500000">
<img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600&q=80">
<h3>تویوتا کرولا</h3>
<p><span class="txt-year">سال</span>: 2020 | <span class="txt-city">شهر</span>: کابل</p>
<p class="price">500,000 <span class="txt-currency">افغانی</span></p>
<button class="btn-wa" onclick="window.open('https://wa.me/971561854027')">واتساپ</button>
</div>

<div class="product" data-brand="هوندا" data-year="2018" data-city="مزار" data-price="420000">
<img src="https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=600&q=80">
<h3>هوندا سیویک</h3>
<p><span class="txt-year">سال</span>: 2018 | <span class="txt-city">شهر</span>: مزار</p>
<p class="price">420,000 <span class="txt-currency">افغانی</span></p>
<button class="btn-wa" onclick="window.open('https://wa.me/971561854027')">واتساپ</button>
</div>
</div>
</div>

<!-- پاپ آپ -->
<div id="filterModal">
<div class="modal-content">
<div class="modal-header">
<h3 id="filterTitle">فیلترها</h3>
<span id="closeBtn" style="font-size:28px;cursor:pointer">×</span>
</div>

<div class="filter-section">
<h4 id="brandTxt">برند ماشین</h4>
<select id="brand" style="width:100%;padding:10px">
<option value="all" id="allMakes">همه برندها</option>
<option>تویوتا</option><option>هوندا</option><option>لکسوس</option>
</select>
</div>

<div class="filter-section">
<h4 id="cityTxt">شهر</h4>
<div class="city-tags">
<button type="button" class
