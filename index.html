<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>افغان مارکت ماشین</title>
    <style>
        body{font-family:Tahoma;background:#f0f2f5;margin:0;padding:0}
        header{background:#2a5298;color:#fff;padding:20px;text-align:center}
        header h1{margin:0;font-size:24px}
        .container{max-width:1200px;margin:15px auto;padding:10px}
        .filters{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:20px}
        .filters h3{margin-top:0;color:#2a5298;text-align:center}
        .filter-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
        .filter-item label{display:block;margin-bottom:6px;font-weight:bold;font-size:14px}
        .filter-item input,.filter-item select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}
        .filter-btn{width:100%;padding:12px;background:#2a5298;color:#fff;border:none;border-radius:6px;margin-top:15px;font-size:16px;font-weight:bold;cursor:pointer}
        .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}
        .product{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden}
        .product img{width:100%;height:200px;
