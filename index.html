<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">افغان مارکت ماشین</title>
<style>
*{box-sizing:border-box}
body{font-family:Tahoma;background:#f0f2f5;margin:0;padding:0}
header{background:#2a5298;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:999}
.lang-select{padding:6px;border-radius:5px;border:none;font-size:14px}
.filter-btn-head{background:#fff;color:#2a5298;border:none;padding:8px 15px;border-radius:5px;font-weight:bold;cursor:pointer}
.container{max-width:1200px;margin:15px auto;padding:10px}

/* پاپ آپ */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1000}
.modal-content{background:#fff;width:100%;max-width:500px;margin:0 auto;height:100%;overflow-y:auto;padding:15px}
.modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:10px}
.filter-section{margin:20px 0;border-bottom:1px solid #eee;padding-bottom:15px}
.filter-section h4{margin:0 0 12px 0;color:#2a5298;font-size:16px}
.city-tags{display:flex;gap:8px;flex-wrap:wrap}
.city-tag-btn{padding:8px 14px;border:1px solid #ccc;border-radius:20px;background:#fff;cursor:pointer;font-size:14px}
.city-tag-btn.active{background:#2a5298;color:#fff;border-color:#2a5298}

/* نوار دوبل رنج */
.range-slider{position:relative;height:5px;background:#ddd;border-radius:5px;margin:30px 0}
.range-slider .progress{position:absolute;height:5px;background:#2a5298;border-radius:5px}
.range-input{position:relative}
.range-input input{position:absolute;width:100%;height:5px;top:-5px;background:none;pointer-events:none;appearance:none}
.range-input input::-webkit-slider-thumb{pointer-events:auto;width:22px;height:22px;border-radius:50%;background:#2a5298;appearance:none;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.2)}
.range-values{display:flex;justify-content:space-between;font-weight:bold;color:#2a5298;margin-bottom:10px}

.quick-btns{display:flex;gap:8px;margin-top:12px}
.quick-btn{flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;background:#f8f8f8;text-align:center;cursor:pointer;font-size:12px}
.quick-btn:active{background:#e0e0e0}
.modal-footer{display:flex;gap:10px;position:sticky;bottom:0;background:#fff;padding:15px 0;border-top:1px solid #ddd}
.btn-clear{flex:1;padding:12px;border:1px solid #ccc;background:#fff;border-radius:5px;cursor:pointer;font-weight:bold}
.btn-show{flex:2;padding:12px;background:#2a5298;color:#fff;border:none;border-radius:5px;font-weight:bold;cursor:pointer}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}
.product{background:#fff;border-radius:10px;padding:12px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.product img{width:100%;height:180px;object-fit:cover;border-radius:8px}
.price{color:#e74c3c;font-weight:bold;font-size:18px;margin:8px 0}
.details{font-size:14px;color:#555}
</style>
</head>

<option value="fa">فارسی</option>

<button class="filter-btn-head" onclick="openModal()" id="filterBtn">🔍 فیلتر</button>
</div>
