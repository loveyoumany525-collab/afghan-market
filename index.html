<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مارکت افغان | خرید و فروش موتر</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#0758b7;--dark:#172033;--muted:#7d8794;--green:#12a85b;--orange:#ffab00;--bg:#f5f6f8;--card:#fff;--text:#222;--border:#e6e8ec;--shadow:#00000008}
.dark{--bg:#0f172a;--dark:#e2e8f0;--card:#1e293b;--text:#f1f5f9;--border:#334155;--shadow:#00000020}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--dark);transition:background .3s,color .3s}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}
.header{background:linear-gradient(135deg,#07377f,#1268d1);color:#fff;padding:16px 4% 28px}
.topbar,.hero,.container,.footer-inner{max-width:1200px;margin:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:900}.logo span{color:#ffd12a}
.nav{display:flex;gap:20px;align-items:center}.nav button{background:transparent;color:#fff}
.lang{background:#fff!important;color:var(--blue)!important;padding:8px 14px;border-radius:20px}
.dark-toggle{background:rgba(255,255,255,.2)!important;color:#fff!important;padding:8px 14px;border-radius:20px}
.hero{padding-top:32px}.hero h1{font-size:36px;margin-bottom:8px}.hero p{opacity:.9;margin-bottom:22px}
.searchbox{background:#fff;padding:10px;border-radius:17px;display:flex;box-shadow:0 10px 30px #0003;gap:8px}
.searchbox input{flex:1;border:0;outline:0;padding:14px;font-size:16px;color:#222;background:transparent}
.searchbtn{background:var(--orange);padding:0 25px;border-radius:11px;font-weight:bold;color:#111}
.container{padding:0 15px;margin:28px auto}.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 16px;flex-wrap:wrap;gap:10px}
.section-title h2{font-size:22px;color:var(--text)}.seeall{color:var(--blue);background:transparent;font-size:14px}
.tabs{display:flex;gap:10px;overflow:auto;padding:4px 0 12px}
.tab{background:var(--card);border:1px solid var(--border);padding:11px 22px;border-radius:25px;white-space:nowrap;color:var(--text);transition:.2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.body-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.body-card,.make-card{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:15px;text-align:center;box-shadow:0 3px 12px var(--shadow);transition:.2s;color:var(--text)}
.body-card:hover,.make-card:hover{transform:translateY(-3px)}
.body-card img{width:100%;height:75px;object-fit:contain}.body-card div{margin-top:8px;color:var(--muted);font-size:13px}
.make-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}.make-card{min-width:145px}.make-card img{width:70px;height:55px;object-fit:contain}.make-card div{color:var(--muted);margin-top:5px;font-size:13px}
.filters{background:var(--card);padding:15px;border-radius:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;box-shadow:0 3px 15px #00000009}
.filters input,.filters select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;outline:none;background:var(--card);color:var(--text)}
.filter-btn{background:var(--blue);color:#fff;border-radius:10px;font-weight:bold;padding:12px}
.sort-wrap{display:flex;align-items:center;gap:8px}.sort-wrap label{color:var(--muted);font-size:13px}
.cars{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #0000000d;cursor:pointer}
.image-wrap{position:relative}.car-img{display:block;width:100%;height:220px;object-fit:cover;background:#111}
.badges{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}.badge{color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:bold}.featured{background:#c21865}.certified{background:#28a957}.inspected{background:#555}
.card-tools{position:absolute;top:12px;left:12px;display:flex;gap:8px}.round{width:40px;height:40px;border-radius:50%;background:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.card-body{padding:15px}.price{font-size:23px;font-weight:900;margin:8px 0;color:var(--text)}.monthly{color:#e29a00;font-size:14px;margin-bottom:8px}.car-title{font-size:18px;font-weight:bold;color:var(--text)}.location{color:#9298a0;margin:8px 0;font-size:14px}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;color:#646b75;border-top:1px solid #eee;padding-top:12px;font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;margin-top:14px}.call{background:var(--blue);color:#fff;padding:12px;border-radius:9px}.visit{background:#ff9f00;color:#fff;padding:12px;border-radius:9px}
.empty{background:var(--card);padding:35px;text-align:center;border-radius:15px;grid-column:1/-1;color:var(--text)}
.sell-section{margin-top:38px;background:linear-gradient(135deg,#062f72,#0870d8);color:#fff;border-radius:22px;padding:32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.sell-btn{background:#ffc21c;color:#111;padding:14px 24px;border-radius:10px;font-weight:bold}
.footer{background:#111827;color:#cbd5e1;margin-top:45px;padding:38px 5%}.footer-inner{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}.footer h3{color:#fff;margin-bottom:10px}.footer p{line-height:2}
.bottom-nav{display:none}
