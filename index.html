<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">افغان مارکت ماشین</title>
<style>
body{font-family:Tahoma;background:#f0f2f5;margin:0;padding:0}
header{background:#2a5298;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}
.lang-select{padding:5px;border-radius:5px;border:none}
.filter-btn-head{background:#fff;color:#2a5298;border:none;padding:8px 15px;border-radius:5px;font-weight:bold}
.container{max-width:1200px;margin:15px auto;padding:10px}

/* پاپ آپ */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000}
.modal-content{background:#fff;width:100%;max-width:500px;margin:0 auto;height:100%;overflow-y:auto;padding:15px}
.modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:10px}
.filter-section{margin:15px 0;border-bottom:1px solid #eee;padding-bottom:15px}
.filter-section h4{margin:0 0 10px 0;color:#2a5298}
.city-tags{display:flex;gap:8px;flex-wrap:wrap}
.city-tag-btn{padding:8px 12px;border:1px solid #ccc;border-radius:20px;background:#fff;cursor:pointer}
.city-tag-btn.active{background:#2a5298;color:#fff}

/* نوار دوبل */
.range-wrap{position:relative;margin:20px 0}
.range-input{width:100%}
.range-input input[type=range]{position:absolute;width:100%;height:5px;background:transparent;pointer-events:none;appearance:none}
.range-input input[type=range]::-webkit-slider-thumb{pointer-events:auto;width:18px;height:18px;border-radius:50%;background:#2a5298;appearance:none}
.price-values{display:flex;justify-content:space-between;font-weight:bold;color:#2a5298}

.quick-btns{display:flex;gap:8px;margin-top:10px}
.quick-btn{flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;background:#f8f8f8;text-align:center;cursor:pointer;font-size:12px}
.modal-footer{display:flex;gap:10px;position:sticky;bottom:0;background:#fff;padding:10px 0}
.btn-clear{flex:1;padding:12px;border:1px solid #ccc;background:#fff;border-radius:5px}
.btn-show{flex:2;padding:12px;background:#2a5298;color:#fff;border:none;border-radius:5px;font-weight:bold}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}
.product{background:#fff;border-radius:10px;padding:10px}
.product img{width:100%;height:180px;object-fit:cover;border-radius:8px}
.price{color:red;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<header>
<h1 id="headerTitle">🚗 افغان مارکت</h1>
<div>
<select class="lang-select" id="lang" onchange="changeLang()">
<option value="fa">فارسی</option>
<option value="en">English</option>
<option value="ps">پښتو</option>
</select>
<button class="filter-btn-head" onclick="openModal()" id="filterBtn">🔍 فیلتر</button>
</div>
</header>

<div class="container">
<div class="products" id="list">
<div class="product" data-brand="تویوتا" data-year="2020" data-city="کابل" data-price="500000" data-km="45000">
<img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600">
<h3>تویوتا کرولا</h3>
<p><span class="txt-year">سال</span>: 2020 | <span class="txt-city">شهر</span>: کابل | 45,000 km</p>
<p class="price">500,000 <span class="txt-currency">افغانی</span></p>
<button onclick="window.open('https://wa.me/971561854027')">واتساپ</button>
</div>
<div class="product" data-brand="هوندا" data-year="2018" data-city="مزار" data-price="420000" data-km="80000">
<img src="https://images.unsplash.com/photo-1549924231-16c5752f55f1?w=600">
<h3>هوندا سیویک</h3>
<p><span class="txt-year">سال</span>: 2018 | <span class="txt-city">شهر</span>: مزار | 80,000 km</p>
<p class="price">420,000 <span class="txt-currency">افغانی</span></p>
<button onclick="window.open('https://wa.me/971561854027')">واتساپ</button>
</div>
</div>
</div>

<!-- پاپ آپ فیلتر -->
<div class="modal" id="filterModal">
<div class="modal-content">
<div class="modal-header">
<h3 id="filterTitle">Filters</h3>
<span onclick="closeModal()" style="font-size:24px;cursor:pointer">×</span>
</div>

<div class="filter-section">
<h4 id="brandTxt">Make & Model</h4>
<select id="brand" style="width:100%;padding:10px">
<option value="all" id="allMakes">Show all makes</option>
<option>تویوتا</option>
<option>هوندا</option>
<option>لکسوس</option>
</select>
</div>

<div class="filter-section">
<h4 id="cityTxt">City</h4>
<div class="city-tags">
<button class="city-tag-btn" onclick="selectCity(this,'کابل')">کابل</button>
<button class="city-tag-btn" onclick="selectCity(this,'مزار')">مزار</button>
<button class="city-tag-btn" onclick="selectCity(this,'هرات')">هرات</button>
</div>
</div>

<div class="filter-section">
<h4 id="priceTxt">Price Range</h4>
<div class="price-values">
<span id="minPriceVal">0</span> <span id="maxPriceVal">5,000,000</span>
</div>
<div class="range-wrap">
<div class="range-input">
<input type="range" id="minPriceRange" min="0" max="5000000" value="0" step="50000">
<input type="range" id="maxPriceRange" min="0" max="5000000" value="5000000" step="50000">
</div>
</div>
<div class="quick-btns">
<div class="quick-btn" onclick="setPrice(0,300000)">Under 300K</div>
<div class="quick-btn" onclick="setPrice(0,500000)">Under 500K</div>
<div class="quick-btn" onclick="setPrice(0,700000)">Under 700K</div>
</div>
</div>

<div class="filter-section">
<h4 id="yearTxt">Year</h4>
<div class="price-values">
<span id="minYearVal">2000</span> <span id="maxYearVal">2024</span>
</div>
<div class="range-wrap">
<div class="range-input">
<input type="range" id="minYearRange" min="2000" max="2024" value="2000">
<input type="range" id="maxYearRange" min="2000" max="2024" value="2024">
</div>
</div>
<div class="quick-btns">
<div class="quick-btn" onclick="setYear(2022,2024)">2022-2024</div>
<div class="quick-btn" onclick="setYear(2017,2021)">2017-2021</div>
<div class="quick-btn" onclick="setYear(2012,2016)">2012-2016</div>
</div>
</div>

<div class="modal-footer">
<button class="btn-clear" onclick="clearAll()" id="clearBtn">Clear all</button>
<button class="btn-show" onclick="applyFilter()" id="showBtn">Show Ads</button>
</div>

</div>
</div>

<script>
let selectedCity = 'all';
let langData = {
fa: {title:"افغان مارکت ماشین", filter:"🔍 فیلتر", filters:"فیلترها", brand:"برند ماشین", all:"همه برندها", city:"شهر", price:"محدوده قیمت", year:"سال", clear:"پاک کردن", show:"نمایش آگهی ها", yearTxt:"سال", cityTxt:"شهر", currency:"افغانی"},
en: {title:"Afghan Car Market", filter:"🔍 Filter", filters:"Filters", brand:"Make & Model", all:"Show all makes", city:"City", price:"Price Range", year:"Year", clear:"Clear all", show:"Show Ads", yearTxt:"Year", cityTxt:"City", currency:"AFN"},
ps: {title:"د افغان موټر مارکیټ", filter:"🔍 فلټر", filters:"فلټرونه", brand:"موټر برانډ", all:"ټول برانډونه", city:"ښار", price:"د بیې لړۍ", year:"کال", clear:"ټول پاک کړئ", show:"اعلانونه ښکاره
