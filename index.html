<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">افغان مارکت ماشین</title>
<style>
*{box-sizing:border-box}
body{font-family:Tahoma;background:#f0f2f5;margin:0;padding:0}
header{background:#2a5298;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:999}
.lang-select{padding:6px;border-radius:5px;border:none;font-size:14px}
.filter-btn-head{background:#fff;color:#2a5298;border:none;padding:8px 15px;border-radius:5px;font-weight:bold;cursor:pointer}
.container{max-width:1200px;margin:15px auto;padding:10px}

/* پاپ آپ */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1000}
.modal.show{display:block} /* اینو اضافه کردم */
.modal-content{background:#fff;width:100%;max-width:500px;margin:0 auto;height:100%;overflow-y:auto;padding:15px}
.modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:10px}
.filter-section{margin:20px 0;border-bottom:1px solid #eee;padding-bottom:15px}
.filter-section h4{margin:0 0 12px 0;color:#2a5298;font-size:16px}
.city-tags{display:flex;gap:8px;flex-wrap:wrap}
.city-tag-btn{padding:8px 14px;border:1px solid #ccc;border-radius:20px;background:#fff;cursor:pointer;font-size:14px}
.city-tag-btn.active{background:#2a5298;color:#fff;border-color:#2a5298}

/* نوار دوبل رنج */
.range-slider{position:relative;height:5px;background:#ddd;border-radius:5px;margin:30px 0}
.range-slider.progress{position:absolute;height:5px;background:#2a5298;border-radius:5px}
.range-input{position:relative;height:5px}
.range-input input{position:absolute;width:100%;height:5px;top:-5px;background:none;pointer-events:none;appearance:none}
.range-input input::-webkit-slider-thumb{pointer-events:auto;width:22px;height:22px;border-radius:50%;background:#2a5298;appearance:none;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.2)}
.range-values{display:flex;justify-content:space-between;font-weight:bold;color:#2a5298;margin-bottom:10px}

.quick-btns{display:flex;gap:8px;margin-top:12px}
.quick-btn{flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;background:#f8f8f8;text-align:center;cursor:pointer;font-size:12px}
.modal-footer{display:flex;gap:10px;position:sticky;bottom:0;background:#fff;padding:15px 0;border-top:1px solid #ddd}
.btn-clear{flex:1;padding:12px;border:1px solid #ccc;background:#fff;border-radius:5px;cursor:pointer;font-weight:bold}
.btn-show{flex:2;padding:12px;background:#2a5298;color:#fff;border:none;border-radius:5px;font-weight:bold;cursor:pointer}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}
.product{background:#fff;border-radius:10px;padding:12px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.product img{width:100%;height:180px;object-fit:cover;border-radius:8px}
.price{color:#e74c3c;font-weight:bold;font-size:18px;margin:8px 0}
.details{font-size:14px;color:#555}
</style>
</head>
<body>
<header>
<h1 id="headerTitle" style="margin:0;font-size:18px">🚗 افغان مارکت</h1>
<div style="display:flex;gap:8px;align-items:center">
<select class="lang-select" id="lang">
<option value="fa">فارسی</option>
<option value="en">English</option>
<option value="ps">پښتو</option>
</select>
<button class="filter-btn-head" id="filterBtn">🔍 فیلتر</button>
</div>
</header>

<div class="container">
<div class="products" id="list">
<div class="product" data-brand="تویوتا" data-year="2020" data-city="کابل" data-price="500000">
<img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600">
<h3>تویوتا کرولا</h3>
<p class="details"><span class="txt-year">سال</span>: 2020 | <span class="txt-city">شهر</span>: کابل</p>
<p class="price">500,000 <span class="txt-currency">افغانی</span></p>
<button style="width:100%;padding:10px;background:#25D366;color:#fff;border:none;border-radius:5px" onclick="window.open('https://wa.me/971561854027')">واتساپ</button>
</div>

<div class="product" data-brand="هوندا" data-year="2018" data-city="مزار" data-price="420000">
<img src="https://images.unsplash.com/photo-1549924231-16c5752f55f1?w=600">
<h3>هوندا سیویک</h3>
<p class="details"><span class="txt-year">سال</span>: 2018 | <span class="txt-city">شهر</span>: مزار</p>
<p class="price">420,000 <span class="txt-currency">افغانی</span></p>
<button style="width:100%;padding:10px;background:#25D366;color:#fff;border:none;border-radius:5px" onclick="window.open('https://wa.me/971561854027')">واتساپ</button>
</div>
</div>
</div>

<!-- پاپ آپ فیلتر -->
<div class="modal" id="filterModal">
<div class="modal-content">
<div class="modal-header">
<h3 id="filterTitle">Filters</h3>
<span id="closeBtn" style="font-size:28px;cursor:pointer">×</span>
</div>

<div class="filter-section">
<h4 id="brandTxt">Make & Model</h4>
<select id="brand" style="width:100%;padding:10px;border-radius:5px;border:1px solid #ccc">
<option value="all" id="allMakes">Show all makes</option>
<option value="تویوتا">تویوتا</option>
<option value="هوندا">هوندا</option>
<option value="لکسوس">لکسوس</option>
</select>
</div>

<div class="filter-section">
<h4 id="cityTxt">City</h4>
<div class="city-tags">
<button type="button" class="city-tag-btn" data-city="کابل">کابل</button>
<button type="button" class="city-tag-btn" data-city="مزار">مزار</button>
<button type="button" class="city-tag-btn" data-city="هرات">هرات</button>
</div>
</div>

<div class="filter-section">
<h4 id="priceTxt">Price Range</h4>
<div class="range-values">
<span id="minPriceVal">0</span> <span id="maxPriceVal">5,000,000</span>
</div>
<div class="range-slider">
<div class="progress" id="priceProgress"></div>
</div>
<div class="range-input">
<input type="range" id="minPriceRange" min="0" max="5000000" value="0" step="50000">
<input type="range" id="maxPriceRange" min="0" max="5000000" value="5000000" step="50000">
</div>
<div class="quick-btns">
<button type="button" class="quick-btn" onclick="setPrice(0,300000)">کمتر از 300K</button>
<button type="button" class="quick-btn" onclick="setPrice(0,500000)">کمتر از 500K</button>
<button type="button" class="quick-btn" onclick="setPrice(0,700000)">کمتر از 700K</button>
</div>
</div>

<div class="filter-section">
<h4 id="yearTxt">Year</h4>
<div class="range-values">
<span id="minYearVal">2000</span> <span id="maxYearVal">2024</span>
</div>
<div class="range-slider">
<div class="progress" id="yearProgress"></div>
</div>
<div class="range-input">
<input type="range" id="minYearRange" min="2000" max="2024" value="2000">
<input type="range" id="maxYearRange" min="2000" max="2024" value="2024">
</div>
<div class="quick-btns">
<button type="button" class="quick-btn" onclick="setYear(2022,2024)">2022-2024</button>
<button type="button" class="quick-btn" onclick="setYear(2017,2021)">2017-2021</button>
<button type="button" class="quick-btn" onclick="setYear(2012,2016)">2012-2016</button>
</div>
</div>

<div class="modal-footer">
<button class="btn-clear" id="clearBtn">Clear all</button>
<button class="btn-show" id="showBtn">Show Ads</button>
</div>
</div>
</div>
