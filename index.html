<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>افغان مارکت ماشین</title>
<style>
body{font-family:Tahoma;background:#f0f2f5;margin:0;padding:0}
header{background:#2a5298;color:#fff;padding:15px;text-align:center}
.container{max-width:1200px;margin:15px auto;padding:10px}
.filters{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}
.filter-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.filter-item label{display:block;margin-bottom:5px;font-weight:bold}
.filter-item select, .filter-item input{width:100%;padding:8px;border:1px solid #ccc;border-radius:5px}
.btn-search{width:100%;padding:12px;background:#2a5298;color:#fff;border:none;border-radius:5px;margin-top:10px;font-size:16px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}
.product{background:#fff;border-radius:10px;padding:10px}
.product img{width:100%;height:180px;object-fit:cover;border-radius:8px}
.price{color:red;font-weight:bold;font-size:18px}
@media(max-width:700px){.filter-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>🚗 افغان مارکت ماشین</h1></header>

<div class="container">
<div class="filters">
<h3>🔍 فیلتر جستجو</h3>
<div class="filter-grid">
<div class="filter-item">
<label>برند</label>
<select id="brand"><option value="all">همه</option><option>تویوتا</option><option>هوندا</option><option>لکسوس</option></select>
</div>
<div class="filter-item">
<label>از سال</label>
<input type="number" id="minYear" placeholder="2015">
</div>
<div class="filter-item">
<label>تا سال</label>
<input type="number" id="maxYear" placeholder="2024">
</div>
<div class="filter-item">
<label>شهر</label>
<select id="city"><option value="all">همه</option><option>کابل</option><option>مزار</option><option>هرات</option></select>
</div>
</div>
<button class="btn-search" onclick="filter()">جستجو</button>
</div>

<div class="products" id="list">
<div class="product" data-brand="تویوتا" data-year="2020" data-city="کابل" data-price="500000">
<img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600">
<h3>تویوتا کرولا</h3>
<p>سال: 2020 | شهر: کابل</p>
<p class="price">500,000 افغانی</p>
<button onclick="window.open('https://wa.me/971561854027')">واتساپ</button>
</div>

<div class="product" data-brand="هوندا" data-year="2018" data-city="مزار" data-price="420000">
<img src="https://images.unsplash.com/photo-1549924231-16c5752f55f1?w=600">
<h3>هوندا سیویک</h3>
<p>سال: 2018 | شهر: مزار</p>
<p class="price">420,000 افغانی</p>
<button onclick="window.open('https://wa.me/971561854027')">واتساپ</button>
</div>
</div>
</div>

<script>
function filter(){
let b=document.getElementById('brand').value;
let minY=parseInt(document.getElementById('minYear').value)||1900;
let maxY=parseInt(document.getElementById('maxYear').value)||3000;
let c=document.getElementById('city').value;
document.querySelectorAll('.product').forEach(p=>{
let pb=p.dataset.brand; let py=parseInt(p.dataset.year); let pc=p.dataset.city;
let show=true;
if(b!='all'&&pb!=b)show=false;
if(py<minY||py>maxY)show=false;
if(c!='all'&&pc!=c)show=false;
p.style.display=show?'block':'none';
});
}
</script>
</body>
</html>
